<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Skills Learning</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Language selection page — large accessible buttons */
    .lang-select-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 75vh;
      text-align: center;
      padding: var(--spacing-lg);
    }
    .lang-select-main h1 {
      font-size: 2.2rem;
      margin-bottom: var(--spacing-xs);
      color: var(--color-text);
    }
    .lang-select-main .lang-instruction {
      font-size: var(--font-size-lg);
      color: #666;
      margin-bottom: var(--spacing-xl);
      max-width: 500px;
    }
    .lang-grid {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      width: 100%;
      max-width: 420px;
    }
    .lang-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl) var(--spacing-lg);
      background: var(--color-card);
      border: 3px solid #ddd;
      border-radius: var(--border-radius);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      min-height: 100px;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-card:hover,
    .lang-card:focus-visible {
      border-color: var(--color-accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      outline: none;
    }
    .lang-card:focus-visible {
      box-shadow: 0 0 0 4px rgba(240, 165, 0, 0.4);
    }
    .lang-card .lang-main {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: var(--spacing-xs);
    }
    .lang-card .lang-sub {
      font-size: var(--font-size-base);
      color: #888;
    }
    /* Language-specific text styling */
    .lang-card .lang-main[lang="fa"] {
      font-family: var(--font-family-fa);
    }
    .lang-card .lang-main[lang="zh-CN"] {
      font-family: var(--font-family-fa); /* fallback — system Chinese font usually available */
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="page-header">
    <h1>🖥️ Computer Skills Learning</h1>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="lang-select-main">
    <p class="lang-instruction">Choose your learning language</p>

    <div class="lang-grid">

      <!-- English -->
      <a href="en/index.html" class="lang-card" onclick="selectAndGo(event, 'en')">
        <span class="lang-main" lang="en">English</span>
        <span class="lang-sub">English only</span>
      </a>

      <!-- Persian -->
      <a href="fa/index.html" class="lang-card" onclick="selectAndGo(event, 'fa')">
        <span class="lang-main" lang="fa" dir="rtl">فارسی</span>
        <span class="lang-sub">English + Persian</span>
      </a>

      <!-- Chinese -->
      <a href="zh/index.html" class="lang-card" onclick="selectAndGo(event, 'zh')">
        <span class="lang-main" lang="zh-CN">中文</span>
        <span class="lang-sub">English + Chinese</span>
      </a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>Computer Skills Website &mdash; Designed for Deaf Learners &mdash; GitHub Pages</p>
  </footer>

  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'computerSkillsPreferredLanguage';

      // Expose click handler for language cards
      window.selectAndGo = function (event, lang) {
        try {
          localStorage.setItem(STORAGE_KEY, lang);
        } catch (e) {
          // Ignore — navigation continues
        }
        // Navigation proceeds via the href attribute
      };

      // Auto-redirect if language is already saved
      (function () {
        var url = new URL(window.location.href);
        // If user explicitly wants to choose, stay on this page
        if (url.searchParams.get('chooseLanguage') === 'true') return;

        var saved = null;
        try {
          saved = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          // Ignore
        }

        var valid = ['en', 'fa', 'zh'];
        if (saved && valid.indexOf(saved) !== -1) {
          window.location.replace(saved + '/index.html');
        }
      })();
    })();
  </script>

</body>
</html>
