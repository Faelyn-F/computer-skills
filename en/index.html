<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Skills</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Skip to main content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Header -->
  <header class="page-header">
    <h1>🖥️ Computer Skills</h1>
    <p style="font-size: var(--font-size-base); max-width: 700px; margin: var(--spacing-sm) auto 0; color: var(--color-text-on-dark);">
      Learn step by step. Build your digital confidence.
    </p>
  </header>

  <!-- Main Content -->
  <main id="main-content" tabindex="-1">
    <div class="container">

      <!-- Change Language control -->
      <div style="text-align:right;margin:var(--spacing-sm) 0;">
        <a href="../index.html?chooseLanguage=true" class="change-lang-btn" aria-label="Change language">
          🌐 Change language
        </a>
      </div>

      <div class="card-grid">

        <!-- Email Card -->
        <a href="../lessons/email.html?lang=en" class="card-link">
          <article class="card">
            <span class="icon" aria-hidden="true">📧</span>
            <span class="en-title">Email</span>
          </article>
        </a>

        <!-- Document Card -->
        <a href="../lessons/document.html?lang=en" class="card-link">
          <article class="card">
            <span class="icon" aria-hidden="true">📄</span>
            <span class="en-title">Create a Document</span>
          </article>
        </a>

        <!-- Google Drive Card -->
        <a href="../lessons/drive.html?lang=en" class="card-link">
          <article class="card">
            <span class="icon" aria-hidden="true">☁️</span>
            <span class="en-title">Google Drive</span>
          </article>
        </a>

        <!-- Internet Basics Card -->
        <a href="../lessons/internet.html?lang=en" class="card-link">
          <article class="card">
            <span class="icon" aria-hidden="true">🌐</span>
            <span class="en-title">Internet Basics</span>
          </article>
        </a>

        <!-- Keyboard & Mouse Card -->
        <a href="../lessons/keyboard.html?lang=en" class="card-link">
          <article class="card">
            <span class="icon" aria-hidden="true">⌨️</span>
            <span class="en-title">Keyboard &amp; Mouse</span>
          </article>
        </a>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>Computer Skills Website &mdash; Designed for Deaf Learners &mdash; GitHub Pages</p>
  </footer>

  <script src="../js/language.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
