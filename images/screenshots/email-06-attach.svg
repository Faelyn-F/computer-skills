<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/></filter></defs></defs>
  <rect width="800" height="450" fill="#f0f2f5" rx="12"/>
  <rect x="120" y="40" width="560" height="370" fill="#fff" rx="8" stroke="#dadce0" filter="url(#shadow)"/>
  <rect x="120" y="40" width="560" height="44" fill="#f2f6fc" rx="8 8 0 0"/>
  <text x="140" y="68" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#222">New Message</text>
  <rect x="135" y="100" width="530" height="32" rx="4" fill="#fff" stroke="#eee"/><text x="148" y="121" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">To: friend@gmail.com</text>
  <rect x="135" y="140" width="530" height="32" rx="4" fill="#fff" stroke="#eee"/><text x="148" y="161" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">Subject: Document for review</text>
  <rect x="135" y="180" width="530" height="130" fill="#fafafa" rx="4" stroke="#eee"/>
  <text x="155" y="205" font-family="Segoe UI, sans-serif" font-size="15" fill="#555">Hi, please review the attached file.</text>
  <!-- Bottom toolbar -->
  <rect x="135" y="320" width="530" height="80" fill="#fafafa" rx="0 0 8 8"/>
  <!-- Attach button - HIGHLIGHTED -->
  <rect x="148" y="338" width="44" height="44" rx="8" fill="#fff8e1" stroke="#f0a500" stroke-width="4"/>
  <rect x="148" y="338" width="44" height="44" rx="8" fill="none" stroke="#f0a500" stroke-width="4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="170" y="366" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24">📎</text>
  <!-- Arrow -->
  <text x="210" y="358" font-family="Segoe UI, sans-serif" font-size="18" fill="#f0a500" font-weight="700">👈 Click Attach</text>
  <!-- File being attached (appearing) -->
  <rect x="260" y="342" width="130" height="36" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>
  <text x="275" y="364" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a73e8" font-weight="600">📄 report.pdf</text>
  <!-- Send button -->
  <circle cx="620" cy="360" r="10" fill="#1a73e8"/><text x="620" y="365" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">S</text>
  <text x="637" y="365" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a73e8" font-weight="600">Send</text>
</svg>