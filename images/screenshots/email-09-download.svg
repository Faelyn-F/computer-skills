<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f8f9fa" rx="12"/>
  <!-- Open email with attachment -->
  <rect x="60" y="20" width="680" height="400" fill="#fff" rx="8" stroke="#dadce0"/>
  <rect x="60" y="20" width="680" height="50" fill="#f2f6fc" rx="8 8 0 0"/>
  <text x="80" y="50" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#222">📎 Report attached</text>
  <text x="80" y="85" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">From: colleague@work.com</text>
  <!-- Attachment box HIGHLIGHTED -->
  <rect x="80" y="105" width="300" height="60" rx="8" fill="#fff8e1" stroke="#f0a500" stroke-width="4"/>
  <rect x="80" y="105" width="300" height="60" rx="8" fill="none" stroke="#f0a500" stroke-width="4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="100" y="130" font-family="Segoe UI, sans-serif" font-size="22">📄</text>
  <text x="130" y="130" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#222">quarterly-report.pdf</text>
  <text x="130" y="150" font-family="Segoe UI, sans-serif" font-size="12" fill="#888">2.4 MB — PDF</text>
  <!-- Download icon HIGHLIGHTED -->
  <rect x="340" y="118" width="36" height="36" rx="6" fill="#1a73e8"/>
  <text x="358" y="143" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#fff">⬇</text>
  <!-- Arrow pointing to download -->
  <text x="370" y="108" font-family="Segoe UI, sans-serif" font-size="20" fill="#f0a500">👆 Click to download</text>
  <!-- Email body -->
  <text x="80" y="200" font-family="Segoe UI, sans-serif" font-size="15" fill="#444">Hi,</text>
  <text x="80" y="222" font-family="Segoe UI, sans-serif" font-size="15" fill="#444">Please find the quarterly report attached.</text>
  <text x="80" y="244" font-family="Segoe UI, sans-serif" font-size="15" fill="#444">Let me know if you have any questions.</text>
</svg>