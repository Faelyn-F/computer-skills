<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#e8f5e9" rx="12"/>
  <!-- Compose window -->
  <rect x="120" y="30" width="560" height="300" fill="#fff" rx="8" stroke="#dadce0"/>
  <rect x="120" y="30" width="560" height="44" fill="#f2f6fc" rx="8 8 0 0"/>
  <text x="140" y="58" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#222">New Message</text>
  <rect x="135" y="88" width="530" height="32" fill="#fff" stroke="#eee" rx="4"/><text x="148" y="109" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">To: friend@gmail.com ✓</text>
  <rect x="135" y="128" width="530" height="32" fill="#fff" stroke="#eee" rx="4"/><text x="148" y="149" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">Subject: Hello ✓</text>
  <rect x="135" y="168" width="530" height="90" fill="#fafafa" rx="4" stroke="#eee"/><text x="155" y="193" font-family="Segoe UI, sans-serif" font-size="15" fill="#555">Hi! This is my practice email. ✓</text>
  <rect x="148" y="270" width="130" height="36" rx="18" fill="#e8f0fe" stroke="#1a73e8"/><text x="163" y="293" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a73e8" font-weight="600">📄 report.pdf</text>
  <!-- Send button HIGHLIGHTED -->
  <rect x="548" y="265" width="110" height="44" rx="22" fill="#1a73e8" stroke="#f0a500" stroke-width="4"/>
  <rect x="548" y="265" width="110" height="44" rx="22" fill="none" stroke="#f0a500" stroke-width="4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="603" y="293" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#fff" font-weight="700">Send</text>
  <!-- Arrow -->
  <text x="630" y="250" font-family="Segoe UI, sans-serif" font-size="30" fill="#f0a500">👆</text>
  <text x="625" y="235" font-family="Segoe UI, sans-serif" font-size="16" fill="#f0a500" font-weight="700">Click!</text>
  <!-- Success indicator -->
  <rect x="300" y="360" width="200" height="50" rx="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" fill="#2e7d32" font-weight="700">✅ Sent!</text>
</svg>