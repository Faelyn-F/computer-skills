<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/></filter></defs></defs>
  <rect width="800" height="450" fill="#f0f2f5" rx="12"/>
  <rect x="120" y="30" width="560" height="390" fill="#fff" rx="8" stroke="#dadce0" filter="url(#shadow)"/>
  <rect x="120" y="30" width="560" height="44" fill="#f2f6fc" rx="8 8 0 0"/>
  <text x="140" y="58" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#222">New Message</text>
  <rect x="135" y="88" width="530" height="32" rx="4" fill="#fff" stroke="#eee"/><text x="148" y="109" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">To: friend@gmail.com</text>
  <rect x="135" y="128" width="530" height="32" rx="4" fill="#fff" stroke="#eee"/><text x="148" y="149" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">Subject: Hello</text>
  <!-- Message body - HIGHLIGHTED -->
  <rect x="135" y="170" width="530" height="190" rx="4" fill="#fffef5" stroke="#f0a500" stroke-width="3"/>
  <rect x="135" y="170" width="530" height="190" rx="4" fill="none" stroke="#f0a500" stroke-width="3" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Typed text in the body -->
  <text x="155" y="200" font-family="Segoe UI, sans-serif" font-size="16" fill="#222">Hi Sarah,</text>
  <text x="155" y="228" font-family="Segoe UI, sans-serif" font-size="16" fill="#222">Hope you are doing well!</text>
  <text x="155" y="256" font-family="Segoe UI, sans-serif" font-size="16" fill="#222">Just wanted to share the document we discussed.</text>
  <text x="155" y="284" font-family="Segoe UI, sans-serif" font-size="16" fill="#222">Best regards,</text>
  <!-- Blinking cursor -->
  <rect x="270" y="286" width="2" height="18" fill="#1a73e8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Arrow -->
  <text x="440" y="155" font-family="Segoe UI, sans-serif" font-size="20" fill="#f0a500">👆 Type here</text>
  <rect x="135" y="370" width="530" height="40" fill="#fafafa" rx="0 0 8 8"/>
  <circle cx="155" cy="390" r="10" fill="#1a73e8"/><text x="155" y="395" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">S</text>
  <text x="172" y="395" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a73e8" font-weight="600">Send</text>
</svg>