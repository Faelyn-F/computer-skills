<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8f9fa"/><stop offset="100%" stop-color="#e8eaed"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Browser frame -->
  <rect x="60" y="30" width="680" height="38" rx="6" fill="#dee1e6"/>
  <circle cx="78" cy="49" r="6" fill="#ff5f57"/>
  <circle cx="98" cy="49" r="6" fill="#febc2e"/>
  <circle cx="118" cy="49" r="6" fill="#28c840"/>
  <!-- Address bar -->
  <rect x="140" y="36" width="580" height="26" rx="13" fill="#fff" stroke="#dadce0" stroke-width="1"/>
  <text x="160" y="54" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" font-weight="600">gmail.com</text>
  <text x="240" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">🔒</text>
  <!-- Arrow pointing to address bar -->
  <path d="M400,78 L400,68 L390,74 L400,68 L410,74 Z" fill="#f0a500"/>
  <text x="400" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#f0a500" font-weight="700">Type this ⬆</text>
  <!-- Browser content -->
  <rect x="60" y="68" width="680" height="340" fill="#fff" rx="0 0 8 8"/>
  <!-- Gmail sidebar mock -->
  <rect x="60" y="68" width="160" height="340" fill="#f2f6fc"/>
  <rect x="76" y="92" width="128" height="32" rx="16" fill="#c2e7ff" filter="url(#shadow)"/>
  <text x="140" y="113" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#001d35">✚ Compose</text>
  <rect x="76" y="140" width="128" height="22" rx="4" fill="#e8f0fe"/>
  <text x="84" y="155" font-family="Segoe UI, sans-serif" font-size="12" fill="#1a73e8" font-weight="600">📥 Inbox (3)</text>
  <text x="84" y="178" font-family="Segoe UI, sans-serif" font-size="12" fill="#5f6368">⭐ Starred</text>
  <text x="84" y="198" font-family="Segoe UI, sans-serif" font-size="12" fill="#5f6368">📤 Sent</text>
  <!-- Inbox emails -->
  <rect x="230" y="88" width="500" height="48" rx="4" fill="#f2f6fc" stroke="#e8eaed" stroke-width="1"/>
  <text x="246" y="115" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#222">Welcome to Gmail</text>
  <text x="246" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">Gmail Team - Welcome to your new account!</text>
  <rect x="230" y="142" width="500" height="48" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
  <text x="246" y="169" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">Your booking confirmation</text>
  <text x="246" y="184" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">Airline - Flight details attached</text>
  <rect x="230" y="196" width="500" height="48" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
  <text x="246" y="223" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">Meeting reminder</text>
  <text x="246" y="238" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">Calendar - Meeting at 3pm today</text>
</svg>