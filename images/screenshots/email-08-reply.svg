<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f8f9fa" rx="12"/>
  <!-- Open email view -->
  <rect x="60" y="20" width="680" height="400" fill="#fff" rx="8" stroke="#dadce0"/>
  <rect x="60" y="20" width="680" height="50" fill="#f2f6fc" rx="8 8 0 0"/>
  <text x="80" y="50" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#222">📧 Welcome to our service</text>
  <text x="80" y="90" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">From: support@company.com</text>
  <text x="80" y="110" font-family="Segoe UI, sans-serif" font-size="14" fill="#666">To: you@gmail.com</text>
  <line x1="80" y1="125" x2="700" y2="125" stroke="#eee" stroke-width="1"/>
  <text x="80" y="155" font-family="Segoe UI, sans-serif" font-size="15" fill="#444">Dear user,</text>
  <text x="80" y="180" font-family="Segoe UI, sans-serif" font-size="15" fill="#444">Thank you for signing up! We are excited to have you on board.</text>
  <!-- Reply button HIGHLIGHTED -->
  <rect x="80" y="220" width="130" height="48" rx="24" fill="#fff" stroke="#f0a500" stroke-width="4"/>
  <rect x="80" y="220" width="130" height="48" rx="24" fill="none" stroke="#f0a500" stroke-width="4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="145" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#444">↩ Reply</text>
  <!-- Forward button next to it -->
  <rect x="220" y="220" width="100" height="48" rx="24" fill="#fff" stroke="#dadce0"/>
  <text x="270" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#666">→ Forward</text>
  <!-- Arrow -->
  <text x="180" y="208" font-family="Segoe UI, sans-serif" font-size="24" fill="#f0a500">👆</text>
  <!-- Reply box preview -->
  <rect x="80" y="290" width="620" height="110" fill="#fffef5" rx="4" stroke="#f0a500" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="315" font-family="Segoe UI, sans-serif" font-size="14" fill="#888">Type your reply here...</text>
</svg>