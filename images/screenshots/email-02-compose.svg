<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8f9fa"/><stop offset="100%" stop-color="#e8eaed"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Gmail interface -->
  <rect x="180" y="20" width="440" height="410" fill="#fff" rx="8" stroke="#dadce0"/>
  <rect x="180" y="20" width="440" height="44" fill="#f2f6fc" rx="8 8 0 0"/>
  <text x="200" y="48" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#222">✉ New Message</text>
  <!-- Yellow highlight glow on Compose button area -->
  <rect x="40" y="120" width="160" height="44" rx="22" fill="#c2e7ff" stroke="#f0a500" stroke-width="4"/>
  <rect x="40" y="120" width="160" height="44" rx="22" fill="none" stroke="#f0a500" stroke-width="4" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#001d35">✚ Compose</text>
  <!-- Big arrow -->
  <text x="220" y="115" font-family="Segoe UI, sans-serif" font-size="28" fill="#f0a500">👆</text>
  <text x="230" y="100" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#f0a500">Click here!</text>
  <!-- Compose popup preview -->
  <rect x="200" y="200" width="380" height="210" fill="#fff" rx="8" stroke="#dadce0" filter="url(#shadow)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/></filter></defs>
  <text x="220" y="230" font-family="Segoe UI, sans-serif" font-size="13" fill="#aaa">To: ____________</text>
  <text x="220" y="260" font-family="Segoe UI, sans-serif" font-size="13" fill="#aaa">Subject: _______</text>
  <rect x="215" y="275" width="350" height="100" fill="#fafafa" rx="4"/>
  <text x="225" y="295" font-family="Segoe UI, sans-serif" font-size="12" fill="#ccc">Write your message...</text>
</svg>