<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f8f9fa"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="#e8eaed"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="url(#hdr)"/>
  <rect x="12" y="10" width="28" height="28" rx="6" fill="linear-gradient(135deg,#1a73e8,#4285f4)"/>
  <text x="26" y="30" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff">M</text>
  <text x="48" y="31" font-family="Segoe UI,sans-serif" font-size="18" fill="#1a73e8" font-weight="600">MailBox</text>

  <!-- Sidebar -->
  <rect x="0" y="50" width="190" height="450" fill="#fff"/>
  <line x1="190" y1="50" x2="190" y2="500" stroke="#eee"/>
  <rect x="10" y="60" width="170" height="34" rx="16" fill="#c2e7ff"/>
  <text x="28" y="83" font-family="Segoe UI,sans-serif" font-size="14" fill="#001d35" font-weight="600">✏️ Compose</text>
  <text x="24" y="118" font-family="Segoe UI,sans-serif" font-size="13" fill="#1a73e8" font-weight="600">📥 Inbox</text>
  <text x="24" y="144" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">⭐ Starred</text>
  <text x="24" y="170" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">📤 Sent</text>

  <!-- Email List -->
  <rect x="190" y="50" width="280" height="450" fill="#fff"/>
  <line x1="470" y1="50" x2="470" y2="500" stroke="#eee"/>

  <!-- Opened email detail pane -->
  <rect x="470" y="50" width="330" height="450" fill="#f8f9fa"/>

  <!-- Email content -->
  <rect x="478" y="58" width="314" height="434" rx="4" fill="#fff" stroke="#eee"/>
  <text x="498" y="82" font-family="Segoe UI,sans-serif" font-size="18" fill="#202124" font-weight="600">Welcome to English Class</text>
  <rect x="498" y="92" width="32" height="32" rx="16" fill="#1a73e8"/>
  <text x="514" y="114" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff" font-weight="600">L</text>
  <text x="540" y="108" font-family="Segoe UI,sans-serif" font-size="13" fill="#202124" font-weight="600">Mrs. Lisa Chen</text>
  <text x="540" y="126" font-family="Segoe UI,sans-serif" font-size="12" fill="#888">&lt;mrs.chen@springfield-college.example&gt;</text>
  <text x="750" y="108" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">Sep 10</text>

  <line x1="498" y1="138" x2="774" y2="138" stroke="#eee"/>

  <!-- Action buttons -->
  <rect x="498" y="148" width="70" height="28" rx="4" fill="#fff" stroke="#dadce0"/>
  <text x="530" y="168" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#202124">↩ Reply</text>

  <!-- Reply button HIGHLIGHTED -->
  <rect x="573" y="146" width="80" height="32" rx="4" fill="none" stroke="#f0a500" stroke-width="3"/>
  <rect x="573" y="146" width="80" height="32" rx="4" fill="rgba(240,165,0,0.12)"/>
  <text x="618" y="168" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#202124" font-weight="700">↩↩ Reply all</text>

  <rect x="658" y="148" width="70" height="28" rx="4" fill="#fff" stroke="#dadce0"/>
  <text x="693" y="168" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#202124">→ Forward</text>

  <!-- Annotation arrow + marker -->
  <text x="500" y="202" font-family="Segoe UI,sans-serif" font-size="22" fill="#f0a500">↑</text>
  <circle cx="525" cy="200" r="13" fill="#f0a500"/>
  <text x="525" y="206" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff" font-weight="700">7</text>

  <line x1="498" y1="210" x2="774" y2="210" stroke="#eee"/>

  <!-- Email body -->
  <text x="498" y="236" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">Dear Student,</text>
  <text x="498" y="258" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">Welcome to the English for Adult</text>
  <text x="498" y="280" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">Learners class! I am very happy</text>
  <text x="498" y="302" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">to have you in my class.</text>
  <text x="498" y="330" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">Our first class is on Monday,</text>
  <text x="498" y="352" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">15 September at 9:00 AM…</text>

  <!-- Email list behind -->
  <rect x="196" y="80" width="266" height="36" rx="2" fill="#f2f6fc"/>
  <text x="206" y="102" font-family="Segoe UI,sans-serif" font-size="12" fill="#202124" font-weight="600">Mrs. Lisa Chen — Welcome...</text>
  <rect x="196" y="120" width="266" height="36" rx="2" fill="#fff"/>
  <text x="206" y="142" font-family="Segoe UI,sans-serif" font-size="12" fill="#5f6368">Springfield College — Timetable</text>
</svg>
