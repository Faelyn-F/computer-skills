<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="700" height="460" fill="rgba(0,0,0,0.4)" rx="0"/>
  <rect x="60" y="30" width="580" height="400" rx="8" fill="#fff" filter="url(#shadow)"/>
  <rect x="60" y="30" width="580" height="42" rx="8 8 0 0" fill="#f2f6fc"/>
  <text x="80" y="56" font-family="Segoe UI,sans-serif" font-size="15" fill="#202124" font-weight="600">New Message</text>
  <circle cx="622" cy="51" r="10" fill="#e0e0e0"/>
  <text x="622" y="56" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#666">✕</text>

  <text x="80" y="96" font-family="Segoe UI,sans-serif" font-size="13" fill="#888">To</text>
  <text x="110" y="96" font-family="Segoe UI,sans-serif" font-size="14" fill="#202124">teacher@mailbox.example</text>
  <line x1="60" y1="108" x2="640" y2="108" stroke="#eee"/>
  <text x="80" y="130" font-family="Segoe UI,sans-serif" font-size="13" fill="#aaa">Cc</text>
  <line x1="60" y1="142" x2="640" y2="142" stroke="#eee"/>
  <text x="80" y="164" font-family="Segoe UI,sans-serif" font-size="13" fill="#888">Subj</text>
  <text x="120" y="164" font-family="Segoe UI,sans-serif" font-size="14" fill="#202124">Monday class</text>
  <line x1="60" y1="176" x2="640" y2="176" stroke="#eee"/>
  <text x="80" y="210" font-family="Segoe UI,sans-serif" font-size="14" fill="#202124">Hello Sarah, I will come to class on…</text>

  <!-- Toolbar -->
  <line x1="60" y1="380" x2="640" y2="380" stroke="#eee"/>
  <rect x="60" y="380" width="580" height="50" rx="0 0 8 8" fill="#fafafa"/>

  <!-- Send button (HIGHLIGHTED) -->
  <rect x="515" y="388" width="110" height="34" rx="4" fill="none" stroke="#f0a500" stroke-width="3"/>
  <rect x="515" y="388" width="110" height="34" rx="4" fill="#1a73e8"/>
  <text x="570" y="412" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff" font-weight="600">Send</text>

  <!-- Annotation marker 6 -->
  <circle cx="655" cy="400" r="14" fill="#f0a500"/>
  <text x="655" y="406" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="15" fill="#fff" font-weight="700">6</text>
  <line x1="641" y1="400" x2="627" y2="400" stroke="#f0a500" stroke-width="2"/>

  <text x="80" y="412" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">📎 Attach</text>
  <text x="170" y="412" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">🗑️ Discard</text>

  <!-- Send vs Sent note area -->
  <rect x="60" y="3" width="212" height="24" rx="4" fill="#fff8e1"/>
  <text x="70" y="20" font-family="Segoe UI,sans-serif" font-size="12" fill="#8d6e00">⚠ Send = button | Sent = folder</text>
</svg>
