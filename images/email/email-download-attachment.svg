<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f8f9fa"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="#e8eaed"/>
  <rect x="0" y="0" width="800" height="48" fill="url(#hdr)"/>
  <rect x="10" y="10" width="28" height="28" rx="6" fill="linear-gradient(135deg,#1a73e8,#4285f4)"/>
  <text x="24" y="29" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff">M</text>
  <text x="46" y="30" font-family="Segoe UI,sans-serif" font-size="18" fill="#1a73e8" font-weight="600">MailBox</text>

  <rect x="30" y="60" width="740" height="340" rx="6" fill="#fff" stroke="#eee"/>

  <text x="50" y="90" font-family="Segoe UI,sans-serif" font-size="18" fill="#202124" font-weight="600">Appointment Confirmation</text>
  <rect x="50" y="100" width="30" height="30" rx="15" fill="#ea4335"/>
  <text x="65" y="121" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#fff">C</text>
  <text x="90" y="116" font-family="Segoe UI,sans-serif" font-size="13" fill="#202124" font-weight="600">City Health Clinic</text>
  <text x="90" y="134" font-family="Segoe UI,sans-serif" font-size="12" fill="#888">&lt;appointments@city-health-clinic.example&gt;</text>
  <text x="740" y="116" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">Sep 12</text>

  <line x1="50" y1="148" x2="750" y2="148" stroke="#eee"/>

  <!-- Attachment area highlighted -->
  <rect x="50" y="158" width="700" height="48" rx="6" fill="rgba(240,165,0,0.06)" stroke="#f0a500" stroke-width="3"/>

  <text x="66" y="180" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">📎 Attachments:</text>
  <rect x="170" y="166" width="210" height="30" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="182" y="186" font-family="Segoe UI,sans-serif" font-size="13" fill="#1a73e8">📄 appointment-details.pdf</text>
  <text x="360" y="186" font-family="Segoe UI,sans-serif" font-size="14" fill="#1a73e8" font-weight="700">⬇</text>

  <!-- Annotation -->
  <circle cx="35" cy="182" r="12" fill="#f0a500"/>
  <text x="35" y="187" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#fff" font-weight="700">9</text>
  <line x1="47" y1="182" x2="50" y2="182" stroke="#f0a500" stroke-width="2"/>

  <!-- Note about removing attachment from draft -->
  <line x1="50" y1="220" x2="750" y2="220" stroke="#eee"/>

  <text x="50" y="248" font-family="Segoe UI,sans-serif" font-size="13" fill="#888" font-weight="600">Remove attachment (in draft):</text>
  <rect x="50" y="258" width="200" height="26" rx="12" fill="#e8f0fe" stroke="#dadce0"/>
  <text x="60" y="276" font-family="Segoe UI,sans-serif" font-size="12" fill="#1a73e8">📄 notes.docx</text>
  <text x="148" y="276" font-family="Segoe UI,sans-serif" font-size="14" fill="#ea4335" font-weight="600">✕</text>
  <!-- Arrow pointing to ✕ -->
  <text x="170" y="268" font-family="Segoe UI,sans-serif" font-size="16" fill="#f0a500">← click to remove</text>

  <line x1="50" y1="300" x2="750" y2="300" stroke="#eee"/>
  <text x="50" y="326" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">Dear Student,</text>
  <text x="50" y="346" font-family="Segoe UI,sans-serif" font-size="13" fill="#555">This email confirms your appointment on Friday…</text>
</svg>
