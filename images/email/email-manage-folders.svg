<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f8f9fa"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="#e8eaed"/>
  <rect x="0" y="0" width="800" height="50" fill="url(#hdr)"/>
  <rect x="12" y="10" width="28" height="28" rx="6" fill="linear-gradient(135deg,#1a73e8,#4285f4)"/>
  <text x="26" y="29" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff">M</text>
  <text x="48" y="31" font-family="Segoe UI,sans-serif" font-size="18" fill="#1a73e8" font-weight="600">MailBox</text>

  <!-- Sidebar with folder highlights -->
  <rect x="0" y="50" width="210" height="470" fill="#fff"/>
  <line x1="210" y1="50" x2="210" y2="520" stroke="#eee"/>

  <!-- Compose -->
  <rect x="14" y="60" width="182" height="36" rx="16" fill="#c2e7ff"/>
  <text x="42" y="84" font-family="Segoe UI,sans-serif" font-size="14" fill="#001d35" font-weight="600">✏️ Compose</text>

  <!-- Inbox (highlighted) -->
  <rect x="10" y="110" width="190" height="30" rx="14" fill="rgba(240,165,0,0.1)" stroke="#f0a500" stroke-width="2"/>
  <text x="26" y="130" font-family="Segoe UI,sans-serif" font-size="13" fill="#1a73e8" font-weight="600">📥 Inbox</text>
  <circle cx="190" cy="125" r="9" fill="#f0a500"/>
  <text x="190" y="130" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#fff" font-weight="700">A</text>

  <!-- Starred -->
  <text x="26" y="160" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">⭐ Starred</text>

  <!-- Drafts (highlighted) -->
  <rect x="10" y="172" width="190" height="30" rx="14" fill="rgba(240,165,0,0.1)" stroke="#f0a500" stroke-width="2"/>
  <text x="26" y="192" font-family="Segoe UI,sans-serif" font-size="13" fill="#202124" font-weight="600">📝 Drafts</text>
  <circle cx="190" cy="187" r="9" fill="#f0a500"/>
  <text x="190" y="192" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#fff" font-weight="700">B</text>

  <!-- Sent (highlighted) -->
  <rect x="10" y="216" width="190" height="30" rx="14" fill="rgba(240,165,0,0.1)" stroke="#f0a500" stroke-width="2"/>
  <text x="26" y="236" font-family="Segoe UI,sans-serif" font-size="13" fill="#202124" font-weight="600">📤 Sent</text>
  <circle cx="190" cy="231" r="9" fill="#f0a500"/>
  <text x="190" y="236" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#fff" font-weight="700">C</text>

  <line x1="14" y1="260" x2="196" y2="260" stroke="#eee"/>

  <!-- Spam (highlighted) -->
  <rect x="10" y="270" width="190" height="30" rx="14" fill="rgba(234,67,53,0.08)" stroke="#ea4335" stroke-width="2"/>
  <text x="26" y="290" font-family="Segoe UI,sans-serif" font-size="13" fill="#d93025" font-weight="600">🚫 Spam</text>
  <circle cx="190" cy="285" r="9" fill="#ea4335"/>
  <text x="190" y="290" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#fff" font-weight="700">D</text>

  <!-- Trash (highlighted) -->
  <rect x="10" y="314" width="190" height="30" rx="14" fill="rgba(234,67,53,0.08)" stroke="#ea4335" stroke-width="2"/>
  <text x="26" y="334" font-family="Segoe UI,sans-serif" font-size="13" fill="#d93025" font-weight="600">🗑️ Trash</text>
  <circle cx="190" cy="329" r="9" fill="#ea4335"/>
  <text x="190" y="334" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#fff" font-weight="700">E</text>

  <!-- Legend -->
  <text x="26" y="370" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">A — Inbox (new emails)</text>
  <text x="26" y="390" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">B — Drafts (not sent)</text>
  <text x="26" y="410" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">C — Sent (already sent)</text>
  <text x="26" y="430" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">D — Spam (junk)</text>
  <text x="26" y="450" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">E — Trash (deleted)</text>

  <!-- Right side: email list -->
  <rect x="210" y="50" width="590" height="470" fill="#fff"/>
  <rect x="210" y="50" width="590" height="34" fill="#f8f9fa"/>
  <text x="226" y="72" font-family="Segoe UI,sans-serif" font-size="12" fill="#5f6368" font-weight="600">Inbox</text>

  <!-- Email rows -->
  <rect x="218" y="90" width="574" height="44" rx="2" fill="#f2f6fc"/>
  <text x="228" y="110" font-family="Segoe UI,sans-serif" font-size="13" fill="#202124" font-weight="600">Mrs. Lisa Chen — Welcome to English Class</text>
  <text x="228" y="126" font-family="Segoe UI,sans-serif" font-size="11" fill="#888">Dear Student, Welcome to…</text>

  <rect x="218" y="140" width="574" height="44" rx="2" fill="#fff"/>
  <text x="228" y="160" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">Springfield College Registrar — Your Class Timetable… 📎</text>

  <rect x="218" y="190" width="574" height="44" rx="2" fill="#fff"/>
  <text x="228" y="210" font-family="Segoe UI,sans-serif" font-size="13" fill="#5f6368">City Health Clinic — Appointment Confirmation… 📎</text>

  <!-- Search highlight -->
  <rect x="218" y="250" width="574" height="30" rx="18" fill="#f1f3f4" stroke="#dadce0"/>
  <text x="240" y="270" font-family="Segoe UI,sans-serif" font-size="13" fill="#888">🔍 Search emails…</text>
  <circle cx="770" cy="265" r="9" fill="#f0a500"/>
  <text x="770" y="270" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#fff" font-weight="700">★</text>
</svg>
